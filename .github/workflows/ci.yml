# Install the pinned environment and check that the study's runs still work.
# Linux x86_64 is the default platform (it is what most of OFT's own CI runs on).
# macOS arm64 also runs, because requirements-lock.txt and the committed SPARC
# results were generated there.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # OFT fork commit that the examples and the ARC mesh are read from (see CLAUDE.md)
  OFT_COMMIT: 8fc4afea835160e1ef0f6d3e2426ab586996d2f8

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # SPARC results were generated on macOS arm64, so other platforms get a looser
          # tolerance: the OFT wheel's solver build and floating-point paths differ.
          - {name: "Linux x86_64", os: ubuntu-24.04, sparc_rtol: "1e-3"}
          - {name: "macOS arm64", os: macos-15, sparc_rtol: "1e-4"}
    steps:
      - uses: actions/checkout@v4

      - name: Check out OFT fork examples
        uses: actions/checkout@v4
        with:
          repository: GitLostintheSauce/OpenFUSIONToolkit
          ref: ${{ env.OFT_COMMIT }}
          path: oft
          sparse-checkout: src/examples/TokaMaker

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pinned environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements-lock.txt
          .venv/bin/pip check
          .venv/bin/python --version
          .venv/bin/pip list | grep -iE '^(OpenFUSIONToolkit|torax|jax|jaxlib|fusion.surrogates) '

      - name: Import TokaMaker+TORAX workflow
        run: .venv/bin/python -c "import OpenFUSIONToolkit.TokaMaker.pulse_design; print('pulse_design imports OK')"

      - name: ARC V3A baseline
        run: |
          .venv/bin/python scripts/run_arcv3a_baseline.py --oft-root oft
          .venv/bin/python scripts/check_ci_results.py arc

      - name: SPARC static scan
        run: |
          .venv/bin/python sparc/static_scan/sparc_static_scan.py
          .venv/bin/python sparc/static_scan/analyze_scan.py
          .venv/bin/python scripts/check_ci_results.py sparc --rtol ${{ matrix.sparc_rtol }}

      - name: TokaMaker learning examples
        run: .venv/bin/python scripts/run_oft_examples.py --oft-root oft

      - name: ITER TokaMaker+TORAX pulse example
        run: .venv/bin/python scripts/run_oft_examples.py --oft-root oft AdvancedWorkflows/Pulse_Design/TokaMaker_TORAX/ITER/ITER_TokaMaker_TORAX_pulse_ex.ipynb

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-outputs-${{ matrix.os }}
          path: |
            figures/
            sparc/static_scan/results/
            work/**/*.png
            work/**/*executed.ipynb
          if-no-files-found: ignore
